name: repair-pr-from-failures

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to repair"
        required: true
        type: string
      issue_number:
        description: "Linked issue number"
        required: true
        type: string
      attempt:
        description: "Current loop attempt"
        required: true
        type: string
      max_attempts:
        description: "Maximum repair/test attempts"
        required: true
        type: string
      failure_summary:
        description: "Failed test lines"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch PR metadata
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = Number('${{ inputs.pr_number }}');

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body || '');
            core.setOutput('head_ref', pr.head.ref);

      - name: Check out PR branch
        run: |
          git fetch origin "${{ steps.pr.outputs.head_ref }}:${{ steps.pr.outputs.head_ref }}"
          git switch "${{ steps.pr.outputs.head_ref }}"

      - name: Build repair prompt
        run: |
          cat > repair_prompt.txt <<'EOF'
          You are the repair agent for this repository.

          PR title:
          ${{ steps.pr.outputs.title }}

          PR body:
          ${{ steps.pr.outputs.body }}

          Failed validation summary:
          ${{ inputs.failure_summary }}

          Current repository context:

          --- README.md ---
          EOF
          cat README.md >> repair_prompt.txt
          cat >> repair_prompt.txt <<'EOF'

          --- index.html ---
          EOF
          cat index.html >> repair_prompt.txt
          cat >> repair_prompt.txt <<'EOF'

          --- app.js ---
          EOF
          cat app.js >> repair_prompt.txt
          cat >> repair_prompt.txt <<'EOF'

          --- style.css ---
          EOF
          cat style.css >> repair_prompt.txt
          cat >> repair_prompt.txt <<'EOF'

          Task:
          Fix the implementation so the failed validation passes.

          Allowed files:
          - index.html
          - app.js
          - style.css
          - README.md

          Output format exactly:
          ===FILE:path===
          full file content
          ===ENDFILE===

          Rules:
          - Output ONLY file blocks
          - For each changed file, output the COMPLETE new file content
          - Do not use markdown fences
          - Do not add explanations
          - Do not output unchanged files
          - Keep the repo simple and static
          - No framework
          - No package manager
          - No backend
          EOF

      - name: Run Copilot CLI repair agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_ACTIONS_TOKEN }}
        run: |
          copilot -p "$(cat repair_prompt.txt)" -s --no-ask-user --allow-tool='read' > repair_output.txt
          echo "Generated repair output:"
          sed -n '1,220p' repair_output.txt

      - name: Write changed files
        run: |
          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          allowed = {"index.html", "app.js", "style.css", "README.md"}
          text = Path("repair_output.txt").read_text(encoding="utf-8")

          pattern = re.compile(r"^===FILE:(.+?)===\n(.*?)\n===ENDFILE===\s*$", re.MULTILINE | re.DOTALL)
          matches = pattern.findall(text)

          if not matches:
              print("No valid file blocks were found in repair output.")
              sys.exit(1)

          written = []

          for raw_path, content in matches:
              path = raw_path.strip()
              if path not in allowed:
                  print(f"Disallowed file in output: {path}")
                  sys.exit(1)

              Path(path).write_text(content, encoding="utf-8")
              written.append(path)

          print("Updated files:", ", ".join(written))
          PY

      - name: Commit repair changes if any
        id: commit_repair
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No repair changes were created."
          else
            git add .
            git commit -m "Repair PR #${{ inputs.pr_number }} after failed validation"
            git push origin "${{ steps.pr.outputs.head_ref }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment repair on PR and issue
        if: steps.commit_repair.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = Number('${{ inputs.pr_number }}');
            const issue_number = Number('${{ inputs.issue_number }}');
            const attempt = Number('${{ inputs.attempt }}');

            const prBody = [
              '## Repair output',
              '',
              `Repair executed after failed TDD attempt ${attempt}.`,
              '',
              'The PR branch was updated and TDD will be triggered again automatically.'
            ].join('\n');

            const issueBody = [
              '## Repair status',
              '',
              `Repair executed after failed TDD attempt ${attempt}.`,
              '',
              'The PR branch was updated. Automatic validation will run again.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: prBody
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: issueBody
            });

      - name: Comment blocked if repair made no changes
        if: steps.commit_repair.outputs.changed != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = Number('${{ inputs.pr_number }}');
            const issue_number = Number('${{ inputs.issue_number }}');

            const body = [
              '## Repair status',
              '',
              'Repair workflow produced no changes.',
              '',
              'The loop is stopping because continuing would just create nonsense.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });

      - name: Trigger TDD workflow again
        if: steps.commit_repair.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORCHESTRATOR_TOKEN }}
          script: |
            const nextAttempt = String(Number('${{ inputs.attempt }}') + 1);

            await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'tdd-from-pr.yml',
              ref: 'main',
              inputs: {
                pr_number: '${{ inputs.pr_number }}',
                issue_number: '${{ inputs.issue_number }}',
                attempt: nextAttempt,
                max_attempts: '${{ inputs.max_attempts }}'
              }
            });

      - name: Mark issue blocked if repair made no changes
        if: steps.commit_repair.outputs.changed != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = Number('${{ inputs.issue_number }}');

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const currentLabels = issue.labels.map(l => l.name);
            const nextLabels = currentLabels.filter(l => l !== 'state:implementing' && l !== 'state:ready-for-review');

            if (!nextLabels.includes('state:blocked')) {
              nextLabels.push('state:blocked');
            }

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: nextLabels
            });