name: ops-from-pr

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to wire into CI"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ops:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository with workflow-capable token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OPS_AUTOMATION_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch PR metadata
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = Number('${{ inputs.pr_number }}');

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body || '');
            core.setOutput('head_ref', pr.head.ref);

      - name: Check out PR branch
        run: |
          git fetch origin "${{ steps.pr.outputs.head_ref }}:${{ steps.pr.outputs.head_ref }}"
          git switch "${{ steps.pr.outputs.head_ref }}"

      - name: Build ops prompt
        run: |
          cat > ops_prompt.txt <<'EOF'
          You are the Ops agent for this repository.

          PR title:
          ${{ steps.pr.outputs.title }}

          PR body:
          ${{ steps.pr.outputs.body }}

          Current repository context:

          --- .github/workflows/ci.yml ---
          EOF
          cat .github/workflows/ci.yml >> ops_prompt.txt
          cat >> ops_prompt.txt <<'EOF'

          --- tests/static-check.sh ---
          EOF
          if [ -f tests/static-check.sh ]; then
            cat tests/static-check.sh >> ops_prompt.txt
          else
            echo "[MISSING FILE: tests/static-check.sh]" >> ops_prompt.txt
          fi
          cat >> ops_prompt.txt <<'EOF'

          Task:
          Update the CI workflow so that tests/static-check.sh is executed in CI.

          Requirements:
          - Keep the CI workflow simple
          - Do not add npm, frameworks, or extra dependencies
          - Preserve the existing required-file checks
          - Add execution of tests/static-check.sh if the file exists
          - Keep the repo static and lightweight

          Allowed files:
          - .github/workflows/ci.yml

          Output format exactly:
          ===FILE:path===
          full file content
          ===ENDFILE===

          Rules:
          - Output ONLY file blocks
          - For each changed file, output the COMPLETE new file content
          - Do not use markdown fences
          - Do not add explanations
          - Do not output unchanged files
          EOF

      - name: Run Copilot CLI ops agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_ACTIONS_TOKEN }}
        run: |
          copilot -p "$(cat ops_prompt.txt)" -s --no-ask-user --allow-tool='read' > ops_output.txt
          echo "Generated ops output:"
          sed -n '1,220p' ops_output.txt

      - name: Write changed workflow file
        run: |
          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          allowed = {".github/workflows/ci.yml"}
          text = Path("ops_output.txt").read_text(encoding="utf-8")

          pattern = re.compile(r"^===FILE:(.+?)===\n(.*?)\n===ENDFILE===\s*$", re.MULTILINE | re.DOTALL)
          matches = pattern.findall(text)

          if not matches:
              print("No valid file blocks were found in ops output.")
              sys.exit(1)

          written = []

          for raw_path, content in matches:
              path = raw_path.strip()
              if path not in allowed:
                  print(f"Disallowed file in output: {path}")
                  sys.exit(1)

              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")
              written.append(path)

          print("Updated files:", ", ".join(written))
          PY

      - name: Smoke test shell script if present
        run: |
          if [ -f tests/static-check.sh ]; then
            chmod +x tests/static-check.sh
            ./tests/static-check.sh
          else
            echo "No tests/static-check.sh found."
            exit 1
          fi

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes were created by the ops workflow."
            exit 1
          fi
          git add .github/workflows/ci.yml
          git commit -m "Wire static checks into CI for PR #${{ inputs.pr_number }}"

      - name: Push branch
        run: |
          git push origin "${{ steps.pr.outputs.head_ref }}"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = Number('${{ inputs.pr_number }}');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: [
                '## Ops output',
                '',
                'The ops workflow updated `.github/workflows/ci.yml` on this PR branch.',
                '',
                'Expected next step:',
                '- rerun CI on the PR',
                '- verify that `tests/static-check.sh` is now part of the normal checks'
              ].join('\n')
            });