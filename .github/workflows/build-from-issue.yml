name: build-from-issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  builder:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch issue and planner comment
        id: issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = Number('${{ inputs.issue_number }}');

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });

            const plannerComment = [...comments].reverse().find(c =>
              typeof c.body === 'string' && c.body.includes('## Planner output')
            );

            core.setOutput('issue_title', issue.title);
            core.setOutput('issue_body', issue.body || '');
            core.setOutput('planner_comment', plannerComment ? plannerComment.body : '');

      - name: Create working branch
        id: branch
        run: |
          BRANCH="auto/issue-${{ inputs.issue_number }}-builder"
          git switch -c "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build builder prompt
        run: |
          cat > builder_prompt.txt <<'EOF'
          You are the Builder agent for this repository.

          Repository: ${{ github.repository }}
          Issue number: #${{ inputs.issue_number }}

          Issue title:
          ${{ steps.issue.outputs.issue_title }}

          Issue body:
          ${{ steps.issue.outputs.issue_body }}

          Planner output:
          ${{ steps.issue.outputs.planner_comment }}

          Current repository context:

          --- README.md ---
          EOF
          cat README.md >> builder_prompt.txt
          cat >> builder_prompt.txt <<'EOF'

          --- index.html ---
          EOF
          cat index.html >> builder_prompt.txt
          cat >> builder_prompt.txt <<'EOF'

          --- app.js ---
          EOF
          cat app.js >> builder_prompt.txt
          cat >> builder_prompt.txt <<'EOF'

          --- style.css ---
          EOF
          cat style.css >> builder_prompt.txt
          cat >> builder_prompt.txt <<'EOF'

          Task:
          Implement the issue by rewriting only the files that actually need to change.

          Allowed files:
          - index.html
          - app.js
          - style.css
          - README.md

          Output format exactly:
          ===FILE:path===
          full file content
          ===ENDFILE===

          Example:
          ===FILE:app.js===
          ...full new content...
          ===ENDFILE===

          Rules:
          - Output ONLY file blocks
          - For each changed file, output the COMPLETE new file content
          - Do not use markdown fences
          - Do not add explanations
          - Do not output unchanged files
          - Keep the repo simple and static
          - No framework
          - No package manager
          - No backend
          EOF

      - name: Run Copilot CLI builder
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_ACTIONS_TOKEN }}
        run: |
          copilot -p "$(cat builder_prompt.txt)" -s --no-ask-user --allow-tool='read' > builder_output.txt
          echo "Generated builder output:"
          sed -n '1,200p' builder_output.txt

      - name: Write changed files
        run: |
          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          allowed = {"index.html", "app.js", "style.css", "README.md"}
          text = Path("builder_output.txt").read_text(encoding="utf-8")

          pattern = re.compile(r"^===FILE:(.+?)===\n(.*?)\n===ENDFILE===\s*$", re.MULTILINE | re.DOTALL)
          matches = pattern.findall(text)

          if not matches:
              print("No valid file blocks were found in builder output.")
              sys.exit(1)

          written = []

          for raw_path, content in matches:
              path = raw_path.strip()
              if path not in allowed:
                  print(f"Disallowed file in output: {path}")
                  sys.exit(1)

              Path(path).write_text(content, encoding="utf-8")
              written.append(path)

          print("Updated files:", ", ".join(written))
          PY

      - name: Validate required files still exist
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f README.md

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes were created by the builder."
            exit 1
          fi
          git add .
          git commit -m "Implement issue #${{ inputs.issue_number }} via builder workflow"

      - name: Push branch
        run: |
          git push --set-upstream origin "${{ steps.branch.outputs.branch }}"

      - name: Create draft PR
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = Number('${{ inputs.issue_number }}');
            const head = '${{ steps.branch.outputs.branch }}';

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Implement issue #${issue_number}: ${{ steps.issue.outputs.issue_title }}`,
              head,
              base: 'main',
              body: [
                `Implements #${issue_number}.`,
                '',
                'Created automatically by the builder workflow.',
                '',
                'Next steps:',
                '- TDD workflow is triggered automatically',
                '- CI runs on this PR',
                '- human review'
              ].join('\n'),
              draft: true
            });

            core.setOutput('pr_url', pr.html_url);
            core.setOutput('pr_number', String(pr.number));
      
      - name: Trigger TDD workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORCHESTRATOR_TOKEN }}
          script: |
            const prNumber = Number('${{ steps.pr.outputs.pr_number }}');
            const issueNumber = Number('${{ inputs.issue_number }}');

            await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'tdd-from-pr.yml',
              ref: 'main',
              inputs: {
                pr_number: String(prNumber),
                issue_number: String(issueNumber),
                attempt: '1',
                max_attempts: '5'
              }
            });

      - name: Comment PR link on issue and update labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = Number('${{ inputs.issue_number }}');
            const prUrl = '${{ steps.pr.outputs.pr_url }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: [
                '## Builder output',
                '',
                `Draft PR created: ${prUrl}`,
                '',
                'The builder workflow generated file updates, committed them, and opened a draft PR.'
              ].join('\n')
            });

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const currentLabels = issue.labels.map(l => l.name);
            const nextLabels = currentLabels.filter(l => l !== 'state:planned');

            if (!nextLabels.includes('state:implementing')) {
              nextLabels.push('state:implementing');
            }

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: nextLabels
            });