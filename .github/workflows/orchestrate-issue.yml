name: orchestrate-issue

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  planner:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.issue.labels.*.name, ','), 'type:feature')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Resolve issue number
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue_number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "issue_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch issue body
        id: issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = Number('${{ steps.vars.outputs.issue_number }}');
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            core.setOutput('title', data.title);
            core.setOutput('body', data.body || '');
            core.setOutput('labels', data.labels.map(l => l.name).join(','));

      - name: Stop if not a feature issue
        shell: bash
        run: |
          LABELS="${{ steps.issue.outputs.labels }}"
          echo "Labels: $LABELS"
          if [[ "$LABELS" != *"type:feature"* ]]; then
            echo "Not a feature issue. Exiting."
            exit 0
          fi

      - name: Build planner prompt
        shell: bash
        run: |
          cat > planner_prompt.txt <<'EOF'
          You are the Planner agent for this repository.

          Repository: ${{ github.repository }}
          Issue number: #${{ steps.vars.outputs.issue_number }}
          Issue title: ${{ steps.issue.outputs.title }}

          Issue body:
          ${{ steps.issue.outputs.body }}

          Current repository context:

          --- README.md ---
          EOF
          cat README.md >> planner_prompt.txt
          cat >> planner_prompt.txt <<'EOF'

          --- index.html ---
          EOF
          cat index.html >> planner_prompt.txt
          cat >> planner_prompt.txt <<'EOF'

          --- app.js ---
          EOF
          cat app.js >> planner_prompt.txt
          cat >> planner_prompt.txt <<'EOF'

          --- style.css ---
          EOF
          cat style.css >> planner_prompt.txt
          cat >> planner_prompt.txt <<'EOF'

          Task:
          Write a concise implementation plan for this issue.

          Rules:
          - Output Markdown only
          - Start with: ## Planner output
          - Include these sections:
            1. Summary
            2. Scope
            3. Affected files
            4. Implementation steps
            5. Test/validation ideas
            6. Risks / edge cases
          - Keep it practical and short
          - Do not write code
          - Assume this repo should stay simple and static unless the issue clearly requires more
          EOF

      - name: Run Copilot CLI planner
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_ACTIONS_TOKEN }}
        run: |
          copilot -p "$(cat planner_prompt.txt)" -s --no-ask-user --allow-tool='read' > plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on issue and update labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.md', 'utf8');
            const issue_number = Number('${{ steps.vars.outputs.issue_number }}');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: plan
            });

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const currentLabels = issue.labels.map(l => l.name);
            const nextLabels = currentLabels.filter(l => l !== 'state:needs-plan');

            if (!nextLabels.includes('state:planned')) {
              nextLabels.push('state:planned');
            }

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: nextLabels
            });