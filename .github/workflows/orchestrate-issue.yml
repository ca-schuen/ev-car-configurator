name: orchestrate-issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  planner:
    if: contains(join(github.event.issue.labels.*.name, ','), 'type:feature')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Build planner prompt
        run: python3 .github/scripts/build-planner-prompt.py

      - name: Run Copilot CLI planner
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_ACTIONS_TOKEN }}
        run: |
          copilot -p "$(cat planner_prompt.txt)" --no-ask-user > plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on issue and update labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.md', 'utf8');
            const issue_number = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: plan
            });

            const currentLabels = context.payload.issue.labels.map(l => l.name);
            const nextLabels = currentLabels.filter(l => l !== 'state:needs-plan');

            if (!nextLabels.includes('state:planned')) {
              nextLabels.push('state:planned');
            }

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: nextLabels
            });