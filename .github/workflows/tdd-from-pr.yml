name: tdd-from-pr

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to enhance with tests"
        required: true
        type: string
      issue_number:
        description: "Linked issue number"
        required: true
        type: string
      attempt:
        description: "Current loop attempt"
        required: true
        type: string
      max_attempts:
        description: "Maximum repair/test attempts"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  tdd:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch PR metadata
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = Number('${{ inputs.pr_number }}');

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body || '');
            core.setOutput('head_ref', pr.head.ref);

      - name: Check out PR branch
        run: |
          git fetch origin "${{ steps.pr.outputs.head_ref }}:${{ steps.pr.outputs.head_ref }}"
          git switch "${{ steps.pr.outputs.head_ref }}"

      - name: Build TDD prompt
        run: |
          cat > tdd_prompt.txt <<'EOF'
          You are the TDD agent for this repository.

          PR title:
          ${{ steps.pr.outputs.title }}

          PR body:
          ${{ steps.pr.outputs.body }}

          Current repository context:

          --- README.md ---
          EOF
          cat README.md >> tdd_prompt.txt
          cat >> tdd_prompt.txt <<'EOF'

          --- index.html ---
          EOF
          cat index.html >> tdd_prompt.txt
          cat >> tdd_prompt.txt <<'EOF'

          --- app.js ---
          EOF
          cat app.js >> tdd_prompt.txt
          cat >> tdd_prompt.txt <<'EOF'

          --- style.css ---
          EOF
          cat style.css >> tdd_prompt.txt
          cat >> tdd_prompt.txt <<'EOF'

          Task:
          Add or update minimal automated validation for the feature in this PR.

          Preferred approach:
          - Create or update tests/static-check.sh
          - Optionally update README.md with a short testing note
          - Keep everything dependency-free
          - Do not introduce npm, frameworks, or a backend

          Allowed files:
          - tests/static-check.sh
          - README.md

          Output format exactly:
          ===FILE:path===
          full file content
          ===ENDFILE===

          Rules:
          - Output ONLY file blocks
          - For each changed file, output the COMPLETE new file content
          - Do not use markdown fences
          - Do not add explanations
          - Do not output unchanged files
          EOF

      - name: Run Copilot CLI TDD agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_ACTIONS_TOKEN }}
        run: |
          copilot -p "$(cat tdd_prompt.txt)" -s --no-ask-user --allow-tool='read' > tdd_output.txt
          echo "Generated TDD output:"
          sed -n '1,220p' tdd_output.txt

      - name: Write changed files
        run: |
          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          allowed = {"tests/static-check.sh", "README.md"}
          text = Path("tdd_output.txt").read_text(encoding="utf-8")

          pattern = re.compile(r"^===FILE:(.+?)===\n(.*?)\n===ENDFILE===\s*$", re.MULTILINE | re.DOTALL)
          matches = pattern.findall(text)

          if not matches:
              print("No valid file blocks were found in TDD output.")
              sys.exit(1)

          written = []

          for raw_path, content in matches:
              path = raw_path.strip()
              if path not in allowed:
                  print(f"Disallowed file in output: {path}")
                  sys.exit(1)

              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")
              written.append(path)

          print("Updated files:", ", ".join(written))
          PY

      - name: Commit TDD changes if any
        id: commit_tdd
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No TDD changes were created."
          else
            git add .
            git commit -m "Add/update tests for PR #${{ inputs.pr_number }} via TDD workflow"
            git push origin "${{ steps.pr.outputs.head_ref }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run shell tests
        id: run_tests
        run: |
          set +e
          if [ -f tests/static-check.sh ]; then
            chmod +x tests/static-check.sh
            ./tests/static-check.sh 2>&1 | tee tdd.log
            status=${PIPESTATUS[0]}
          else
            echo "FAIL: tests/static-check.sh is missing" | tee tdd.log
            status=1
          fi

          grep 'FAIL:' tdd.log > fail_lines.txt || true
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment success on PR and issue
        if: steps.run_tests.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const pr_number = Number('${{ inputs.pr_number }}');
            const issue_number = Number('${{ inputs.issue_number }}');
            const attempt = Number('${{ inputs.attempt }}');
            const log = fs.readFileSync('tdd.log', 'utf8');

            const prBody = [
              '## TDD output',
              '',
              `Attempt ${attempt}: PASS`,
              '',
              'The TDD workflow completed successfully.',
              '',
              '```text',
              log.slice(0, 4000),
              '```'
            ].join('\n');

            const issueBody = [
              '## TDD status',
              '',
              `Attempt ${attempt}: PASS`,
              '',
              'Validation passed for the current PR branch.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: prBody
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: issueBody
            });

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const currentLabels = issue.labels.map(l => l.name);
            const nextLabels = currentLabels.filter(l => l !== 'state:implementing' && l !== 'state:blocked');

            if (!nextLabels.includes('state:ready-for-review')) {
              nextLabels.push('state:ready-for-review');
            }

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: nextLabels
            });

      - name: Comment failure on PR and issue
        if: steps.run_tests.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const pr_number = Number('${{ inputs.pr_number }}');
            const issue_number = Number('${{ inputs.issue_number }}');
            const attempt = Number('${{ inputs.attempt }}');
            const maxAttempts = Number('${{ inputs.max_attempts }}');
            const fails = fs.existsSync('fail_lines.txt') ? fs.readFileSync('fail_lines.txt', 'utf8').trim() : 'No FAIL lines captured.';
            const log = fs.readFileSync('tdd.log', 'utf8');

            const prBody = [
              '## TDD output',
              '',
              `Attempt ${attempt}: FAIL`,
              '',
              'Failed checks:',
              '```text',
              fails || 'No FAIL lines captured.',
              '```',
              '',
              'Full test log excerpt:',
              '```text',
              log.slice(0, 4000),
              '```'
            ].join('\n');

            const issueBody = [
              '## TDD status',
              '',
              `Attempt ${attempt}: FAIL`,
              '',
              'Failed checks:',
              '```text',
              fails || 'No FAIL lines captured.',
              '```',
              '',
              `Automatic repair will ${attempt < maxAttempts ? 'be triggered' : 'NOT be triggered because max attempts were reached'}.`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: prBody
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: issueBody
            });

      - name: Trigger repair workflow
        if: steps.run_tests.outputs.exit_code != '0' && inputs.attempt < inputs.max_attempts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORCHESTRATOR_TOKEN }}
          script: |
            const fs = require('fs');
            const fails = fs.existsSync('fail_lines.txt') ? fs.readFileSync('fail_lines.txt', 'utf8').trim() : 'No FAIL lines captured.';

            await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'repair-pr-from-failures.yml',
              ref: 'main',
              inputs: {
                pr_number: '${{ inputs.pr_number }}',
                issue_number: '${{ inputs.issue_number }}',
                attempt: '${{ inputs.attempt }}',
                max_attempts: '${{ inputs.max_attempts }}',
                failure_summary: fails
              }
            });

      - name: Mark issue blocked after max attempts
        if: steps.run_tests.outputs.exit_code != '0' && inputs.attempt >= inputs.max_attempts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = Number('${{ inputs.issue_number }}');

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const currentLabels = issue.labels.map(l => l.name);
            const nextLabels = currentLabels.filter(l => l !== 'state:implementing' && l !== 'state:ready-for-review');

            if (!nextLabels.includes('state:blocked')) {
              nextLabels.push('state:blocked');
            }

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: nextLabels
            });