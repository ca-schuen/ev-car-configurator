name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f README.md

      - name: Run static checks
        run: |
          if [ -f tests/static-check.sh ]; then
            bash tests/static-check.sh
          fi