name: Feature request
description: Create a structured feature request for the AI team
title: "[Feature]: "
labels:
  - type:feature
  - state:needs-plan
body:
  - type: textarea
    id: business-goal
    attributes:
      label: Business goal
      description: What business/user outcome should this feature achieve?
      placeholder: Example: Users should be able to share their current EV configuration with others.
    validations:
      required: true

  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: Describe the feature from the user's perspective
      placeholder: Example: As a visitor, I want to copy a shareable link so others can open the same configuration.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Concrete conditions that must be fulfilled
      placeholder: |
        - A share button exists
        - Opening the link restores the same config
        - Invalid values fall back safely
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - frontend
        - backend
        - ops
        - mixed
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What is explicitly out of scope?
      placeholder: Example: No backend, no framework migration, no auth
    validations:
      required: false